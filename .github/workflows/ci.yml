name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Guardrails (PRs only)
        if: github.event_name == 'pull_request'
        env:
          # Passed through env, never interpolated into the script (injection-safe).
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        # The script is taken from the base branch, not from the PR: a PR that changes the
        # guardrails is judged by the rules in force before it (CLAUDE.md -> Merging).
        run: |
          git show "origin/$BASE_REF:tools/check_guardrails.py" > "$RUNNER_TEMP/check_guardrails.py"
          python "$RUNNER_TEMP/check_guardrails.py" "origin/$BASE_REF"
      - run: pytest -q
