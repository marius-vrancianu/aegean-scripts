name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Guardrails (PRs only)
        if: github.event_name == 'pull_request'
        run: python tools/check_guardrails.py origin/${{ github.base_ref }}
      - run: pytest -q
