[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegean"
version = "0.0.1"
description = "Falsifiable computational analyses of Linear A and related Aegean scripts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["pdfplumber>=0.11"]  # Younger PDF reader (aegean.corpus.younger)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
